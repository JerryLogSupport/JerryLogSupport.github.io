<!DOCTYPE html>
<html>
<head>
    <title>JerryLog的运价文件</title>
</head>
<body>
    <h1>欢迎访问JerryLog的运价文件</h1>
    <p>点击下方链接下载或查看 Excel 文件：</p>
    <a href="内部-捷美报价表-2026.1.16.xlsx">下载 内部-捷美报价表-2026.1.16.xlsx</a>
    <br>
    <a href="捷美报价表-2026.1.16.xlsx">下载 捷美报价表-2026.1.16.xlsx.xlsx</a>
    
    <!-- 这里显示动态更新时间 -->
    <p id="last-updated">正在加载最后更新时间...</p>

    <!-- JavaScript 代码放在 body 最后 -->
    <script>
        // 替换成你的 GitHub 用户名和仓库名（小写！）
        const owner = 'jerrylogsupport';          // 例如 'loghk'
        const repo = 'jerrylogsupport.github.io'; // 例如 'loghk.github.io'

        fetch(`https://api.github.com/repos/${owner}/${repo}/commits?per_page=1`)
            .then(response => {
                if (!response.ok) {
                    throw new Error('API 请求失败');
                }
                return response.json();
            })
            .then(data => {
                if (data.length > 0) {
                    const commitDate = new Date(data[0].commit.committer.date);
                    
                    // 格式化为香港时间（HKT，北京时间+8小时，但 GitHub 是 UTC）
                    const options = {
                        timeZone: 'Asia/Hong_Kong',
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    };
                    
                    const formattedDate = commitDate.toLocaleString('zh-CN', options);
                    
                    document.getElementById('last-updated').innerHTML = 
                        `最后更新时间：${formattedDate} (基于 GitHub commit)`;
                } else {
                    document.getElementById('last-updated').innerHTML = '无法获取更新时间';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('last-updated').innerHTML = '加载更新时间失败（可能是网络问题）';
            });
    </script>
</body>
</html>
